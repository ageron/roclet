<!doctype html><html lang="en"><meta charset="utf-8"><title>M5 rich output checks</title><style>body{font:14px/1.5 system-ui;margin:2rem}iframe{width:100%;height:650px;border:1px solid #ddd}pre{white-space:pre-wrap}</style><h1>M5 rich output checks</h1><p id="status">Starting isolated notebook…</p><pre id="log"></pre><iframe title="Isolated rich output test"></iframe><script type="module">
const frame=document.querySelector('iframe');
const html=await fetch('./edit.html').then(r=>r.text());
const page=new DOMParser().parseFromString(html,'text/html');
const bootstrap=page.getElementById('notebook-bootstrap');
if(!bootstrap)throw new Error('Notebook bootstrap was not found');
bootstrap.textContent='';bootstrap.src='./m5-conformance.mjs';
frame.srcdoc='<!doctype html>'+page.documentElement.outerHTML;
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow || event.origin!==location.origin || !event.data?.rocletM5) return;document.getElementById('status').textContent=event.data.status;document.getElementById('log').textContent=event.data.log;if(event.data.result) document.documentElement.dataset.result=event.data.result;});
</script></html>
