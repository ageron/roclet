<!doctype html><html lang="en"><meta charset="utf-8"><title>Roclet selective evaluation benchmark</title><style>body{font:16px/1.6 system-ui;max-width:720px;margin:3rem auto;padding:1rem}pre{white-space:pre-wrap}</style><h1>Selective evaluation benchmark</h1><p>Five warm runs change one of eight independent outputs. Every selective result is compared with a clean full run. Both paths still check the whole module.</p><p id="status">Running…</p><pre id="log"></pre><script type="module">
import { DocumentSession } from './document-session.mjs';
import { benchmark } from '../tests/m4-benchmark.mjs';
let session;
try {
  session=new DocumentSession(await fetch('../artifacts/roclet.wasm').then(r=>r.arrayBuffer()));
  const result=await benchmark(session);

  document.getElementById('status').textContent='PASS — all results match the full reference';document.documentElement.dataset.result='pass';
} catch(error){document.getElementById('log').textContent=error.stack??error.message;document.documentElement.dataset.result='fail';}
finally {session?.stop();}
</script></html>
