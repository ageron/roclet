name: Deploy Roclet

on:
  workflow_run:
    workflows: [Roclet CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Roclet CI run for the current main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Select the verified main artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and
            .path == ".github/workflows/ci.yml" and .head_branch == "main" and
            .head_repository.full_name == $repo and
            (.event == "push" or .event == "workflow_dispatch")
          ' "$RUNNER_TEMP/source-run.json"
          tested_sha=$(jq -r .head_sha "$RUNNER_TEMP/source-run.json")
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          echo "run_id=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          if [ "$tested_sha" = "$current_sha" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Skipping this older artifact because main has advanced.'
          fi
      - name: Download the verified site
        if: steps.source.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: roclet-site
          path: verified-site
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Unpack the verified site
        if: steps.source.outputs.publish == 'true'
        run: unzip -q verified-site/roclet-pages.zip -d _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.publish == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.source.outputs.publish == 'true'
        id: deployment
