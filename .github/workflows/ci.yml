name: Roclet CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roclet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-fetcher:
    name: Public package fetcher
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/package-fetcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/package-fetcher/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
  verify:
    name: Build, test, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Report initial disk space
        run: df -h . "$RUNNER_TEMP"
      - name: Read engine build settings
        # Baseline CPU flags make cached binaries portable across hosted runners.
        run: sed '/^#/d; /^$/d' ci/engine-build.env >> "$GITHUB_ENV"
      - name: Read pinned Zig version
        id: zig-version
        run: |
          version=$(jq -er .zigVersion compiler.lock.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned Zig
        # Official GitHub mirror of https://codeberg.org/mlugg/setup-zig/.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig-version.outputs.version }}
          # Cache only downloaded sources below; compiled engines have their own cache.
          use-cache: false
      - name: Check generated artifacts are absent
        run: test ! -e artifacts/manifest.json
      - name: Restore compiled engines
        id: engines
        uses: actions/cache/restore@v4
        with:
          path: .engine-cache
          # Exact matches only: never run engines from different source/build inputs.
          key: roclet-engines-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler.lock.json', 'build.zig', 'build.zig.zon', 'compiler-adapter/**/*', 'vendor/md4c/*.c', 'vendor/md4c/*.h', 'tools/build-tool.zig', 'tools/compress-builtins.zig', 'tools/prepare-compiler.sh', 'ci/engine-build.env') }}
      - name: Restore Zig dependency sources
        uses: actions/cache/restore@v4
        id: dependencies
        with:
          # Zig 0.17 materializes downloaded packages here. Do not restore
          # .zig-cache or the global cache: accumulated build outputs can fill
          # the runner while the compressed archive is still on disk.
          path: zig-pkg
          key: roclet-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler.lock.json', 'build.zig.zon') }}
      - name: Prepare pinned compiler dependency
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/roc"
          git -C "$RUNNER_TEMP/roc" remote add origin "$(jq -r .compilerRepository compiler.lock.json)"
          git -C "$RUNNER_TEMP/roc" fetch --depth=1 origin "$(jq -r .compilerCommit compiler.lock.json)"
          sh tools/prepare-compiler.sh "$RUNNER_TEMP/roc"
      - name: Build engines on cache miss (ReleaseFast)
        if: steps.engines.outputs.cache-hit != 'true'
        run: |
          /usr/bin/time -v zig build adapter $ROCLET_BUILD_FLAGS --summary all
          mkdir -p .engine-cache
          cp artifacts/roclet-native artifacts/roclet-profile.wasm .engine-cache/
          chmod +x .engine-cache/roclet-native
      - name: Save compiled engines
        if: steps.engines.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .engine-cache
          key: ${{ steps.engines.outputs.cache-primary-key }}
      - name: Run native tests with cached engines
        # Tests, manifests and parity reports still run against this checkout.
        run: |
          set -o pipefail
          /usr/bin/time -v zig build test $ROCLET_BUILD_FLAGS -Dcached-engines=.engine-cache --summary all 2>&1 | tee "$RUNNER_TEMP/roclet-native-tests.log"
      - name: Summarize native build and test timings
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/roclet-native-tests.log" ]; then
            {
              echo '### Native build and test timings'
              echo 'Compile steps show whether binaries were cached, reused within this build, or rebuilt.'
              echo '```text'
              sed -n '/^Build Summary:/,$p' "$RUNNER_TEMP/roclet-native-tests.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run JavaScript unit and workspace tests
        run: |
          zig build local-server
          node --test tests/*.test.mjs
      - name: Test package pin updates and installer
        run: |
          python3 tests/test-package-pin.py
          python3 tests/test-installers.py
          python3 tools/mirror-packages.py --check
      - name: Package the verified site
        run: zig build package $ROCLET_BUILD_FLAGS -Dcached-engines=.engine-cache --summary all
      - name: Smoke-test the server distribution
        run: |
          python3 tools/release-server.py --site zig-out/roclet-pages.zip --binary zig-out/bin/roclet-serve --platform linux-x64 --version 0.0.0 --output zig-out/server-release
          python3 tests/test-server-release.py zig-out/server-release/roclet-0.0.0-linux-x64.tar.gz
      - name: Run Chrome conformance tests
        run: |
          node tools/test-browser.mjs
          node tools/test-local-project.mjs
      - name: Check dependency cache size
        if: ${{ success() && steps.dependencies.outputs.cache-hit != 'true' }}
        id: dependency-size
        shell: bash
        run: |
          set -euo pipefail
          if [ -d zig-pkg ]; then
            size_kib=$(du -sk zig-pkg | cut -f1)
            echo "Dependency sources: $size_kib KiB"
            # Bound the uncompressed restore size to 1 GiB. An oversized
            # dependency set can still build; it just won't be persisted.
            if [ "$size_kib" -le 1048576 ]; then
              echo "save=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Skipping dependency cache: exceeds 1 GiB"
            fi
          fi
      - name: Save Zig dependency sources
        if: ${{ success() && steps.dependency-size.outputs.save == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: zig-pkg
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Report final disk usage
        if: ${{ always() }}
        shell: bash
        run: |
          df -h . "$RUNNER_TEMP"
          for path in .engine-cache .toolchain .zig-cache zig-pkg "$HOME/.cache/zig"; do
            if [ -d "$path" ]; then du -sh "$path"; fi
          done
      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: roclet-site
          path: zig-out/roclet-pages.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
