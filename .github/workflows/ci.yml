name: Roclet CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roclet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read engine build settings
        # Baseline CPU flags make cached binaries portable across hosted runners.
        run: sed '/^#/d; /^$/d' ci/engine-build.env >> "$GITHUB_ENV"
      - name: Read pinned Zig version
        id: zig-version
        run: |
          version=$(jq -er .zigVersion compiler.lock.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned Zig
        # Official GitHub mirror of https://codeberg.org/mlugg/setup-zig/.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig-version.outputs.version }}
          # Restore/save below owns both Zig caches and the prepared compiler.
          use-cache: false
      - name: Check generated artifacts are absent
        run: test ! -e artifacts/manifest.json
      - name: Restore compiled engines
        id: engines
        uses: actions/cache/restore@v4
        with:
          path: .engine-cache
          # Exact matches only: never run engines from different source/build inputs.
          key: roclet-engines-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler.lock.json', 'build.zig', 'build.zig.zon', 'compiler-adapter/**/*', 'package/**/*', 'vendor/**/*', 'tools/build-tool.zig', 'tools/compress-builtins.zig', 'tools/prepare-compiler.sh', 'ci/engine-build.env') }}
      - name: Restore Zig build cache
        uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: |
            .toolchain
            .zig-cache
            ~/.cache/zig
          key: roclet-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler.lock.json') }}-${{ hashFiles('build.zig', 'build.zig.zon', 'compiler-adapter/**/*', 'package/**/*', 'vendor/**/*', 'tools/**/*', 'tests/**/*', 'ci/**/*', '.github/workflows/ci.yml') }}
          restore-keys: |
            roclet-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler.lock.json') }}-
      - name: Prepare pinned compiler dependency
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/roc"
          git -C "$RUNNER_TEMP/roc" remote add origin "$(jq -r .compilerRepository compiler.lock.json)"
          git -C "$RUNNER_TEMP/roc" fetch --depth=1 origin "$(jq -r .compilerCommit compiler.lock.json)"
          sh tools/prepare-compiler.sh "$RUNNER_TEMP/roc"
      - name: Build engines on cache miss (ReleaseFast)
        if: steps.engines.outputs.cache-hit != 'true'
        run: |
          /usr/bin/time -v zig build adapter $ROCLET_BUILD_FLAGS --summary all
          mkdir -p .engine-cache
          cp artifacts/roclet-native artifacts/roclet-profile.wasm .engine-cache/
          chmod +x .engine-cache/roclet-native
      - name: Save compiled engines
        if: steps.engines.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .engine-cache
          key: ${{ steps.engines.outputs.cache-primary-key }}
      - name: Run native tests with cached engines
        # Tests, manifests and parity reports still run against this checkout.
        run: |
          set -o pipefail
          /usr/bin/time -v zig build test $ROCLET_BUILD_FLAGS -Dcached-engines=.engine-cache --summary all 2>&1 | tee "$RUNNER_TEMP/roclet-native-tests.log"
      - name: Summarize native build and test timings
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/roclet-native-tests.log" ]; then
            {
              echo '### Native build and test timings'
              echo 'Compile steps show whether binaries were cached, reused within this build, or rebuilt.'
              echo '```text'
              sed -n '/^Build Summary:/,$p' "$RUNNER_TEMP/roclet-native-tests.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run JavaScript unit and workspace tests
        run: node --test tests/*.test.mjs
      - name: Package the verified site
        run: zig build package $ROCLET_BUILD_FLAGS -Dcached-engines=.engine-cache --summary all
      - name: Run Chrome conformance tests
        run: node tools/test-browser.mjs
      - name: Save compiler build cache
        if: ${{ always() && !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .toolchain
            .zig-cache
            ~/.cache/zig
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: roclet-site
          path: zig-out/roclet-pages.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
